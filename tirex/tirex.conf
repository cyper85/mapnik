#  Konfiguration von tirex-master und tirex-backend-manager (Dockerfile.tirex)

stats_dir=/var/cache/tirex/stats

#  Gleicher Socket wie bei renderd: Der Apache-Container (mod_tile) funktioniert mit beiden unverändert
modtile_socket_name=/run/renderd/renderd.sock

#  Interne Sockets von Tirex (Master, tirex-send, tirex-status)
socket_dir=/run/tirex

master_pidfile=/run/tirex/tirex-master.pid

#  Kein Job-Log: im Container rotiert niemand die Datei, Statistiken liefert tirex-status
master_logfile=/dev/null

#  Prioritäten von mod_tile: fehlende Tiles 1 (live), veraltete Tiles 25 (background).
#  maxproc von "live" setzt tirex-entrypoint.sh auf THREADS.
#  maxload bezieht sich auf die Load des Hosts, Container haben keine eigene
bucket name=live       minprio=1  maxproc=4 maxload=20
bucket name=important  minprio=10 maxproc=3 maxload=8
bucket name=background minprio=20 maxproc=2 maxload=4

backend_manager_pidfile=/run/tirex/tirex-backend-manager.pid
