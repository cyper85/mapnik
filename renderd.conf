; Wird von renderd (Dockerfile.renderd) und mod_tile (Dockerfile.apache) gemeinsam genutzt.
; plugins_dir wird beim Bauen von Dockerfile.renderd automatisch gesetzt.
[renderd]
num_threads=4
pid_file=/run/renderd/renderd.pid
stats_file=/run/renderd/renderd.stats
socketname=/run/renderd/renderd.sock
tile_dir=/var/cache/renderd/tiles

[mapnik]
plugins_dir=/usr/lib/x86_64-linux-gnu/mapnik/4.2/input
font_dir=/usr/share/fonts
font_dir_recurse=1

[default]
MAXZOOM=20
URI=/tile/
TILEDIR=/var/cache/renderd/tiles
XML=/usr/share/openstreetmap-carto/style.xml
HOST=tile.stadtplan-ilmenau.de
TILESIZE=256
