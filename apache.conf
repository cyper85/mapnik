<VirtualHost *:80>
    ServerAdmin webmaster@stadtplan-ilmenau.de

    LoadTileConfigFile /etc/renderd.conf
    ModTileRenderdSocketName /run/renderd/renderd.sock
    ModTileRequestTimeout 0
    ModTileMissingRequestTimeout 30
    # Kein Neu-Rendern (/dirty) und keine Statusseite (/status) für Besucher
    ModTileEnableDirtyURL Off
    ModTileEnableStatusURL Off

    # Echte Client-IP aus X-Forwarded-For übernehmen, aber nur von vertrauenswürdigen Proxys
    RemoteIPHeader X-Forwarded-For
    RemoteIPInternalProxy ${TRUSTED_PROXIES}

    # Massendownloads bremsen: Token-Bucket pro Client-IP, darüber hinaus antwortet mod_tile mit 503
    ModTileEnableTileThrottling On
    ModTileEnableTileThrottlingXForward 0
    ModTileThrottlingTiles ${THROTTLE_TILES}
    ModTileThrottlingRenders ${THROTTLE_RENDERS}

    DocumentRoot /var/www/html

    # Karten nur auf freigegebenen Seiten (ALLOWED_DOMAINS inkl. Subdomains) einbindbar,
    # ALLOWED_ORIGIN_REGEX wird von apache-foreground.sh erzeugt
    SetEnvIfNoCase Referer "${ALLOWED_ORIGIN_REGEX}" allowed_referer=1
    SetEnvIfNoCase Origin "${ALLOWED_ORIGIN_REGEX}" cors_origin=$0
    <IfDefine ALLOW_EMPTY_REFERER>
        SetEnvIf Referer "^$" allowed_referer=1
    </IfDefine>

    # Sperre per mod_rewrite statt "Require": mod_tile beauftragt renderd schon vor der
    # Zugriffsprüfung (authz), gesperrte Anfragen würden sonst trotzdem rendern
    RewriteEngine On
    RewriteCond %{ENV:allowed_referer} !=1
    # Gilt für alle Kartenstile (URI-Einträge in renderd.conf)
    RewriteRule ^/(tile|cyclosm)/ - [F]

    <LocationMatch "^/(tile|cyclosm)/">
        Header always set Access-Control-Allow-Origin "%{cors_origin}e" env=cors_origin
        Header always merge Vary Origin
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
